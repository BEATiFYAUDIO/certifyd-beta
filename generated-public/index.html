<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certifyd Technical Beta</title>
  <meta name="description" content="Private Certifyd technical beta invitation." />
  <style>:root{color-scheme:dark;--bg:#06131d;--panel:#0d2232;--line:#315064;--text:#f3f8ff;--muted:#bed0df;--orange:#ff9900}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17475e,var(--bg) 48%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.site-header{border-bottom:1px solid var(--line);background:rgba(5,16,25,.92)}.brand{display:inline-flex;padding:22px clamp(20px,4vw,56px);font-weight:900;font-size:24px;letter-spacing:.02em;color:var(--text);text-decoration:none}.container{width:min(1040px,calc(100vw - 40px));margin:0 auto;padding:clamp(32px,7vw,96px) 0}.panel{background:rgba(10,29,43,.84);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,58px);box-shadow:0 30px 90px rgba(0,0,0,.28)}.eyebrow{color:var(--orange);font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:900}.hero h1{font-size:clamp(44px,8vw,92px);line-height:.93;letter-spacing:-.065em;margin:10px 0 24px}.lead{font-size:clamp(19px,2.3vw,27px);line-height:1.45;max-width:800px}.muted{color:var(--muted)}.mission-card{margin:32px 0;padding:24px;border:1px solid var(--line);border-radius:20px;background:rgba(4,17,27,.54)}.mission-card h2{font-size:clamp(28px,4vw,44px);line-height:1;margin:8px 0 12px}.actions{display:flex;gap:14px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:15px 22px;border-radius:999px;font-weight:900;text-decoration:none}.button.primary{background:linear-gradient(135deg,#ffd56a,var(--orange));color:#050505}.button.secondary{border:1px solid var(--line);color:var(--text);background:#132737}@media(max-width:640px){.container{width:min(100vw - 24px,600px);padding:24px 0}.panel{border-radius:22px}.actions{display:grid}.button{width:100%}}</style>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">certifyd</a></header>
  <main class="container">
    <section class="panel hero">
      <p class="eyebrow">Certifyd Technical Beta</p>
      <h1>Private beta invitations.</h1>
      <p class="muted">Certifyd Core is opening to a small group of invited creators, partners, and builders. Use the private invitation link you received to view your mission.</p>
    </section>
  </main>
</body>
</html>

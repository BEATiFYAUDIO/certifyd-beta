name: Deploy public beta pages

on:
  push:
    branches: [main]
    paths:
      - generated-public/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload generated public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: generated-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
